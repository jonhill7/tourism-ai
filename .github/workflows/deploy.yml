name: Deploy to GitHub Pages

# Publishes the built site to the gh-pages branch. GitHub Pages serves that
# branch (auto-provisioned on first push) — no Pages API permissions needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Best-effort: turns Pages on if it's off (e.g. after the gh-pages branch was
      # deleted, which un-provisions the site). Never fatal — publishing only needs the
      # branch push below, so if the API is unavailable this step must not block it.
      - uses: actions/configure-pages@v4
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
